<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenLocker Deploy</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --fg:#14161a; --hint:#5f6672; --accent:#2f5bea; --ok:#13804b; --err:#c0392b; --line:#dde1e7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101215; --card:#1a1d22; --fg:#eceef1; --hint:#9aa1ad; --accent:#6c8cff; --ok:#3ccf86; --err:#ff6b5e; --line:#2a2f37; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:20px 16px 40px; }
  main { max-width:460px; margin:0 auto; display:grid; gap:14px; }
  h1 { font-size:22px; margin:0; }
  p { margin:0; color:var(--hint); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; display:grid; gap:10px; }
  .row { display:flex; justify-content:space-between; gap:12px; font-size:15px; }
  .row span:first-child { color:var(--hint); }
  .row span:last-child { text-align:right; word-break:break-all; font-family:ui-monospace, Menlo, monospace; font-size:13px; }
  button { width:100%; border:0; border-radius:12px; padding:15px; font:600 17px/1.2 inherit; font-family:inherit; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); padding:12px; font-size:15px; }
  button:disabled { opacity:.45; }
  #status { font-size:14px; white-space:pre-wrap; word-break:break-word; }
  #status.ok { color:var(--ok); } #status.err { color:var(--err); }
  #result { font-family:ui-monospace, Menlo, monospace; font-size:15px; word-break:break-all; padding:12px; border-radius:10px; border:1px dashed var(--ok); }
  a { color:var(--accent); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Deploy TokenLocker</h1>
  <p>Open this page inside your wallet app's browser. It puts the time-lock contract on the network your wallet is using. You approve one transaction.</p>

  <section class="card">
    <div class="row"><span>Wallet</span><span id="acct">not connected</span></div>
    <div class="row"><span>Network</span><span id="net">–</span></div>
    <div class="row"><span>Balance</span><span id="bal">–</span></div>
    <button id="connect">Connect wallet</button>
    <button id="toSepolia" class="ghost" hidden>Switch to Sepolia</button>
    <button id="deploy" disabled>Deploy</button>
  </section>

  <section class="card">
    <div id="status">Tap "Connect wallet" to start.</div>
    <div id="resultWrap" hidden>
      <p>Your contract address:</p>
      <div id="result"></div>
      <button id="copy" class="ghost">Copy address</button>
      <p id="explorer"></p>
    </div>
  </section>
</main>
<script>
"use strict";
const BYTECODE = "0x608060405260016002553480156013575f80fd5b506110ea806100215f395ff3fe608060405260043610610087575f3560e01c8063c378a90f11610057578063c378a90f14610132578063c3f9ab5814610151578063e3f08c1d1461017e578063e5edb8181461019d578063f4dadc61146101c9575f80fd5b80632e1a7d4d146100a95780633e9e0378146100ca5780634f1bfc9e146100f05780639b10b6f51461011f575f80fd5b366100a557604051630918a35360e11b815260040160405180910390fd5b5f80fd5b3480156100b4575f80fd5b506100c86100c3366004610e29565b610233565b005b6100dd6100d8366004610e5b565b61042c565b6040519081526020015b60405180910390f35b3480156100fb575f80fd5b506101076312cc030081565b6040516001600160401b0390911681526020016100e7565b34801561012a575f80fd5b505f546100dd565b34801561013d575f80fd5b506100dd61014c366004610e91565b610494565b34801561015c575f80fd5b5061017061016b366004610eca565b610576565b6040516100e7929190610f1d565b348015610189575f80fd5b506100c8610198366004610fc4565b610738565b3480156101a8575f80fd5b506101bc6101b7366004610eca565b61085c565b6040516100e79190610fee565b3480156101d4575f80fd5b506101e86101e3366004610e29565b6108c5565b604080516001600160a01b0396871681529590941660208601526001600160801b03909216928401929092526001600160401b0390911660608301521515608082015260a0016100e7565b6002546001146102565760405163558a1e0360e11b815260040160405180910390fd5b600280555f805481908390811061026f5761026f611000565b5f918252602090912060039091020180549091506001600160a01b031633146102ab576040516330cd747160e01b815260040160405180910390fd5b6002810154600160c01b900460ff16156102d857604051636507689f60e01b815260040160405180910390fd5b6002810154600160801b90046001600160401b031642101561030d57604051636100d92960e11b815260040160405180910390fd5b60028101805460ff60c01b198116600160c01b1790915560018201546001600160801b03909116906001600160a01b03166103b85781546040515f916001600160a01b03169083908381818185875af1925050503d805f811461038b576040519150601f19603f3d011682016040523d82523d5f602084013e610390565b606091505b50509050806103b2576040516312171d8360e31b815260040160405180910390fd5b506103d6565b60018201 8301516001600160801b0316908601526060808301516001600160401b0316908601526080918201511515918501919091529093019260a090920191600101610f4b565b50909695505050505050565b5f8060408385031215610fd5575f80fd5b82359150610fe560208401610e40565b90509250929050565b602081525f610e746020830184610ee3565b634e487b7160e01b5f52603260045260245ffd5b634e487b7160e01b5f52601160045260245ffd5b8181038181111561103b5761103b611014565b92915050565b634e487b7160e01b5f52604160045260245ffd5b5f82518060208501845e5f920191825250919050565b5f6020828403121561107b575f80fd5b81518015158114610e74575f80fd5b8082018082111561103b5761103b611014565b5f602082840312156110ad575f80fd5b505191905056fea26469706673582212207bc19267e8fb04966ac0c5e9d9619f8055a34af65678c8e2c8120669d23cb80a64736f6c634300081a0033";
const NETS = { 11155111: ["Sepolia (test)", "https://sepolia.etherscan.io"], 1: ["Ethereum Mainnet", "https://etherscan.io"], 8453: ["Base", "https://basescan.org"], 84532: ["Base Sepolia (test)", "https://sepolia.basescan.org"], 56: ["BNB Chain", "https://bscscan.com"], 97: ["BNB Testnet", "https://testnet.bscscan.com"], 137: ["Polygon", "https://polygonscan.com"], 42161: ["Arbitrum", "https://arbiscan.io"] };
const $ = (id) => document.getElementById(id);
let eth = null, account = null, chainId = null;

function status(msg, cls = "") { const s = $("status"); s.textContent = msg; s.className = cls; }
function errText(e) {
  if (!e) return "Unknown error";
  if (typeof e === "string") return e;
  const m = e.message || e.data?.message || e.error?.message;
  let raw = ""; try { raw = JSON.stringify(e); } catch {}
  return (m || "Error") + (e.code !== undefined ? " (code " + e.code + ")" : "") + (raw && raw !== "{}" && !m ? "\n" + raw : "");
}

async function refresh() {
  chainId = parseInt(await eth.request({ method: "eth_chainId" }), 16);
  const accs = await eth.request({ method: "eth_accounts" });
  account = accs[0] || null;
  $("acct").textContent = account ? account.slice(0, 6) + "…" + account.slice(-4) : "not connected";
  $("net").textContent = (NETS[chainId]?.[0] || "Chain " + chainId);
  if (account) {
    const wei = BigInt(await eth.request({ method: "eth_getBalance", params: [account, "latest"] }));
    $("bal").textContent = (Number(wei) / 1e18).toFixed(4) + " ETH";
  }
  $("toSepolia").hidden = chainId === 11155111;
  $("deploy").disabled = !account;
  $("deploy").textContent = account ? "Deploy on " + (NETS[chainId]?.[0] || "chain " + chainId) : "Deploy";
}

$("connect").onclick = async () => {
  eth = window.ethereum || window.trustwallet?.ethereum || window.trustWallet?.ethereum;
  if (!eth) return status("No wallet found. Open this page inside your wallet app's built-in browser (Trust Wallet → Browser/Discover), not in Chrome or Brave.", "err");
  try {
    await eth.request({ method: "eth_requestAccounts" });
    eth.on?.("chainChanged", () => refresh());
    eth.on?.("accountsChanged", () => refresh());
    await refresh();
    $("connect").hidden = true;
    status(chainId === 11155111 ? "Connected to Sepolia. Tap Deploy." : "Connected. For testing, switch to Sepolia first.");
  } catch (e) { status("Couldn't connect: " + errText(e), "err"); }
};

$("toSepolia").onclick = async () => {
  try {
    await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0xaa36a7" }] });
  } catch (e) {
    if (e.code === 4902) {
      try {
        await eth.request({ method: "wallet_addEthereumChain", params: [{ chainId: "0xaa36a7", chainName: "Sepolia", rpcUrls: ["https://ethereum-sepolia-rpc.publicnode.com"], nativeCurrency: { name: "Sepolia ETH", symbol: "ETH", decimals: 18 }, blockExplorerUrls: ["https://sepolia.etherscan.io"] }] });
      } catch (e2) { return status("Couldn't add Sepolia: " + errText(e2) + "\nSwitch to Sepolia in your wallet app manually, then reload this page.", "err"); }
    } else return status("Couldn't switch: " + errText(e) + "\nSwitch to Sepolia in your wallet app manually, then reload this page.", "err");
  }
  await refresh(); status("On Sepolia. Tap Deploy.");
};

$("deploy").onclick = async () => {
  if (chainId !== 11155111 && !$("deploy").dataset.sure) {
    $("deploy").dataset.sure = "1";
    $("deploy").textContent = "Tap again to deploy on " + (NETS[chainId]?.[0] || "chain " + chainId) + " (real money)";
    return;
  }
  $("deploy").disabled = true;
  try {
    status("Confirm the transaction in your wallet…");
    let gas;
    try { gas = await eth.request({ method: "eth_estimateGas", params: [{ from: account, data: BYTECODE }] }); }
    catch { gas = "0x1E8480"; } // 2,000,000 fallback
    const hash = await eth.request({ method: "eth_sendTransaction", params: [{ from: account, data: BYTECODE, gas }] });
    status("Sent. Waiting for the network to confirm (usually 10–30 seconds)…\nTx: " + hash);
    let rc = null;
    for (let i = 0; i < 120 && !rc; i++) {
      await new Promise((r) => setTimeout(r, 2500));
      rc = await eth.request({ method: "eth_getTransactionReceipt", params: [hash] }).catch(() => null);
    }
    if (!rc) throw new Error("Still waiting after 5 minutes. Check the transaction in your wallet's activity list.");
    if (rc.status !== "0x1") throw new Error("The deploy transaction failed on-chain. Tx: " + hash);
    const addr = rc.contractAddress;
    status("Deployed!", "ok");
    $("result").textContent = addr;
    $("resultWrap").hidden = false;
    const ex = NETS[chainId]?.[1];
    $("explorer").innerHTML = ex ? '<a href="' + ex + '/address/' + addr + '" target="_blank" rel="noopener">View on block explorer</a>' : "";
  } catch (e) {
    status("Deploy failed: " + errText(e), "err");
    $("deploy").disabled = false;
  }
};

$("copy").onclick = async () => {
  const t = $("result").textContent;
  try { await navigator.clipboard.writeText(t); $("copy").textContent = "Copied"; }
  catch { const r = document.createRange(); r.selectNodeContents($("result")); getSelection().removeAllRanges(); getSelection().addRange(r); $("copy").textContent = "Selected – long-press to copy"; }
};
</script>
